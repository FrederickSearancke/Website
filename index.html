<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freddie's Website</title>
  <style>
  .box {
  position: absolute;
  top: 50px;
  left: 15px;
  right: 15px;
  height: 150px;
  background-color: #4285F4;}

  .bannerText {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;           /* full width for text-align */
      text-align: center;
      font-size: 100px;                       /* larger for banners */
      font-family: 'Oswald', sans-serif;     /* bold, condensed style */
      font-weight: 700;                      /* ensure bold */
      color: #ffffff;        /* Google Blue */
      padding: 15px 0;       /* space above and below text */
      transition: opacity 0.1s ease-in-out;  /* animate opacity */
      opacity: 1;
    }

    .bannerText.scrolled {
      opacity: 0;                             /* target state */
    }

    .boarderLeft {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 15px;
      bottom:-300px;
      background-color: #3b3b3b;
    }

    .boarderRight {
      position: absolute;
      top: 0px;
      right: 0px;
      width: 15px;
      bottom:-300px;
      background-color: #3b3b3b;
    }
    
  </style>
</head>
<body>
  
  <!-- getting the front page working! -->
  
    <div class="box"></div>
    <div class="boarderLeft"></div>
    <div class="boarderRight"></div>
    <div class="bannerText">Frederick's Website</div>


  <body>
  …  
  <!-- JavaScript to detect scroll -->
  <script>
    // ① Grab the element you’ll animate
    const banner = document.querySelector('.bannerText');

    // ② Listen for any scroll event on the window
    window.addEventListener('scroll', function() {
      // ③ Measure how far the page is scrolled
      const scrollY = window.scrollY || document.documentElement.scrollTop;

      // ④ Conditional: if we’ve passed 200px
      if (scrollY > 200) {
        // ⑤ “True” branch: add the class to trigger CSS
        banner.classList.add('scrolled');
      } else {
        // ⑥ “False” branch: remove it when we scroll back up
        banner.classList.remove('scrolled');
      }
    });
  </script>
</body>

  
</body>
</html>
