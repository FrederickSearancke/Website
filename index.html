<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freddie’s Website</title>
  <style>
    /* Reset default margins */
    body { margin: 0; padding: 0; }

    /* Banner box */
    .box {
      position: absolute;
      top: 50px;
      left: 15px;
      right: 15px;
      height: 150px;
      background-color: #4285F4;
    }

    /* Banner text */
    .bannerText {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-size: 100px;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      color: #ffffff;
      padding: 15px 0;
      transition: opacity 0.5s ease-in-out;
      opacity: 1;
    }
    .bannerText.scrolled { opacity: 0; }

    /* Side borders */
    .boarderLeft, .boarderRight {
      position: absolute; top: 0; bottom: 0; width: 15px; background-color: #3b3b3b;
    }
    .boarderLeft { left: 0; }
    .boarderRight { right: 0; }

    /* Button container under banner */
    .btn-container {
      position: absolute;
      top: 240px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-around;
      transition: top 0.3s ease;
    }

    /* When scrolled past threshold, fix to top */
    .btn-container.newscrolled {
      position: fixed;
      top: 0;
      left: 15px;
      right: 15px;
      background: white;      /* optional: add background so buttons are legible */
      z-index: 1000;
    }

    /* Generic button styling */
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      background-color: #4285F4;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn:hover { background-color: #3367D6; }
  </style>
</head>
<body>
  <div class="box"></div>
  <div class="boarderLeft"></div>
  <div class="boarderRight"></div>
  <div class="bannerText">Frederick's Website</div>

  <!-- Use consistent class naming: btn-container -->
  <div class="btn-container">
    <button class="btn">Who Am I</button>
    <button class="btn">Hire Me</button>
    <button class="btn">Projects</button>
    <button class="btn">Private API key authenticator</button>
  </div>

  <script>
    const banner = document.querySelector('.bannerText');
    const btnContainer = document.querySelector('.btn-container');

    window.addEventListener('scroll', function() {
      const scrollY = window.scrollY || document.documentElement.scrollTop;
      // Fade banner at 200px
      if (scrollY > 200) {
        banner.classList.add('scrolled');
      } else {
        banner.classList.remove('scrolled');
      }
      // Fix buttons at top after 250px
      if (scrollY > 250) {
        btnContainer.classList.add('newscrolled');
      } else {
        btnContainer.classList.remove('newscrolled');
      }
    });
  </script>
</body>
</html>
