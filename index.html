<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freddie’s Website</title>
  <style>

    /* ─── RESET & BASE ─── */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* (You can leave overflow:auto here; we’ll hide scrollbars below) */
    }

    /* 1) Chrome, Safari & Opera */
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none; 
    }

    /* 2) Firefox */
    html,
    body {
      scrollbar-width: none; /* “none” hides the bar in Firefox */
    }

    /* 3) IE/Edge (legacy) */
    html,
    body {
      -ms-overflow-style: none; /* hides scrollbar in old IE/Edge */
    }


    /* ← NEW: single backdrop image behind everything */
    .bg-backdrop {
      position: fixed;       /* stick to viewport */
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;         /* full viewport height */
      z-index: 1;            /* behind all other content */
      background-image: url('images/ChatGPT Image Jun 4, 2025, 08_03_17 PM.png');
      background-size: cover;      /* scale/crop to fill */
      background-position: center; /* center the image */
      background-repeat: no-repeat;
    }

    /* Banner box */
    .box {
      position: absolute;
      top: 50px;
      left: 15px;
      right: 15px;
      height: 150px;
      background-color: #4285F4;
      z-index: 2;
    }

    /* Banner text */
    .bannerText {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-size: 100px;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      color: #ffffff;
      padding: 15px 0;
      opacity: 1;
      z-index: 3;
    }
    .bannerText.scrolled { opacity: 0; }

    /* Side borders */
    .boarderLeft, .boarderRight {
      position: absolute;
      top: 0;
      bottom: -500px;
      width: 15px;
      background-color: #3b3b3b;
      z-index: 3;
    }
    .boarderLeft { left: 0; }
    .boarderRight { right: 0; }

    .btn-container {
      position: sticky;
      top: 0;
      margin: 240px 15px 0;
      display: flex;
      justify-content: space-around;
      z-index: 5;

      /* make the container transparent: */
      background-color: transparent;
      padding: 10px 0;
      /* no z-index needed here if you want it “under” the strips */
    }

    /* 3) buttons at layer 2 */
    .btn {
      position: relative;   /* so z-index takes effect */
      padding: 10px 20px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      background-color: #4285F4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn:hover { background-color: #3367D6; }
  </style>
</head>
<body>

  <!-- Single backdrop replacing the four‐strip layout -->
  <div class="bg-backdrop"></div>

  <div class="box"></div>
  <div class="boarderLeft"></div>
  <div class="boarderRight"></div>
  <div class="bannerText">Frederick's Website</div>

  <div class="btn-container">
    <a href="whoami.html" class="btn">Who Am I</a>
    <a href="hireme.html" class="btn">Hire Me</a>
    <a href="projects.html" class="btn">Projects</a>
    <a href="authenticator.html" class="btn">Private API Key Authenticator</a>
  </div>

  <script>
    const banner = document.querySelector('.bannerText');
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY || document.documentElement.scrollTop;
      if (scrollY > 200) banner.classList.add('scrolled');
      else banner.classList.remove('scrolled');
    });
  </script>
</body>
</html>
