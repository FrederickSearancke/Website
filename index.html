<html lang="en">
<head>

  <title>Freddie's Website</title>
  <style>
  .box {
  position: absolute;
  top: 50px;

  background-color: #4285F4;}

  .bannerText {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);

      text-align: center;
      font-size: 100px;                       /* larger for banners */
      font-family: 'Oswald', sans-serif;     /* bold, condensed style */
      font-weight: 700;                      /* ensure bold */
      color: #ffffff;        /* Google Blue */
      padding: 15px 0;       /* space above and below text */
    }

    .boarderLeft {
      position: absolute;
      top: 0px:
      left: 0px;
      width: 15px;
      bottom:0px;
      background-color: #3b3b3b;
    }

    .boarderRight {
      position: absolute;
      top: 0px;
      right: 0px;
      width: 15px;
      bottom:0px;
      background-color: #3b3b3b;
    }
    
  </style>
</head>
<body>
  <!-- getting the front page working! -->
  
    <div class="box"></div>
    <div class="boarderLeft"></div>
