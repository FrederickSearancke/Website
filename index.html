<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freddie’s Website</title>
  <style>
    /* Reset default margins */
    body { margin: 0; padding: 0; height: 100%;}

    /* ← NEW: four thin strips behind everything */
    .bg-strips {
      position: fixed;      /* stick to viewport */
      top: 0; left: 0;
      width: 100%; 
      height: 100vh;        /* adjust to the “thin” height you want */
      z-index: -1;          /* behind all other content */
      display: flex;
    }
    .bg-strips img {
      flex: 1;             /* each image takes 25% of the width */
      width: 25%;          /* fallback if flex is not supported */
      height: 100%;        /* fill the parent’s height */
      object-fit: cover;   /* crop/zoom to fill */
    }

    /* Banner box */
    .box {
      position: absolute;
      top: 50px;
      left: 15px;
      right: 15px;
      height: 150px;
      background-color: #4285F4;
    }

    /* Banner text */
    .bannerText {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-size: 100px;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      color: #ffffff;
      padding: 15px 0;
      transition: opacity 0.5s ease-in-out;
      opacity: 1;
    }
    .bannerText.scrolled { opacity: 0; }

    /* Side borders */
    .boarderLeft, .boarderRight {
      position: absolute;
      top: 0;
      bottom: -500px;
      width: 15px;
      background-color: #3b3b3b;
    }
    .boarderLeft { left: 0; }
    .boarderRight { right: 0; }

    /* Button container under banner using sticky positioning */
    .btn-container {
      position: sticky;
      top: 0;
      margin: 240px 15px 0;
      display: flex;
      justify-content: space-around;
      background: white;
      z-index: 1000;
      padding: 10px 0;
    }

    /* Generic button styling */
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      background-color: #4285F4;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn:hover { background-color: #3367D6; }
  </style>
</head>
<body>

  <div class="bg-strips">
    <img src="images/strip1.jpg" alt="Strip 1">
    <img src="images/strip2.jpg" alt="Strip 2">
    <img src="IMG_1792 (1).png" alt="Strip 3">
    <img src="images/strip4.jpg" alt="Strip 4">
  </div>
  
  <div class="box"></div>
  <div class="boarderLeft"></div>
  <div class="boarderRight"></div>
  <div class="bannerText">Frederick's Website</div>

  <div class="btn-container">
    <a href="whoami.html" class="btn">Who Am I</a>
    <a href="hireme.html" class="btn">Hire Me</a>
    <a href="projects.html" class="btn">Projects</a>
    <a href="authenticator.html" class="btn">Private API Key Authenticator</a>
  </div>

  <script>
    const banner = document.querySelector('.bannerText');
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY || document.documentElement.scrollTop;
      if (scrollY > 200) banner.classList.add('scrolled');
      else banner.classList.remove('scrolled');
    });
  </script>
</body>
</html>
