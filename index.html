<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Website</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header, footer { background-color: #333; color: #fff; text-align: center; padding: 1rem; }
    nav a { margin: 0 1rem; color: #fff; text-decoration: none; }
    main { padding: 2rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Basic Website</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main>
    <section id="home">
      <h2>Home</h2>
      <p>This is a simple static site.</p>
      <button id="clickBtn">Click me!</button>
    </section>
    <section id="about">
      <h2>About</h2>
      <p>This site was created as an example.</p>
    </section>
    <section id="contact">
      <h2>Contact</h2>
      <p>Email: example@example.com</p>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 My Basic Website</p>
  </footer>
  <script>
    document.getElementById('clickBtn').addEventListener('click', function() {
      alert('Button clicked!');
    });
  </script>
</body>
</html>
