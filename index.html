<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freddie's Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
  .box {
  position: absolute;
  top: 50px;
  left: 15px;
  right: 15px;
  height: 150px;
  background-color: #4285F4;}

  .bannerText {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;           /* full width for text-align */
      text-align: center;
      font-size: 100px;                       /* larger for banners */
      font-family: 'Oswald', sans-serif;     /* bold, condensed style */
      font-weight: 700;                      /* ensure bold */
      color: #ffffff;        /* Google Blue */
      padding: 15px 0;       /* space above and below text */
      transition: opacity 0.5s ease-in-out;  /* animate opacity */
      opacity: 1;
    }

    .bannerText.scrolled {
      opacity: 0;                             /* target state */
    }

    .boarderLeft {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 15px;
      bottom:-300px;
      background-color: #3b3b3b;
    }

    .boarderRight {
      position: absolute;
      top: 0px;
      right: 0px;
      width: 15px;
      bottom:-300px;
      background-color: #3b3b3b;
    }

    /* Generic button styling */
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      background-color: #4285F4;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #3367D6;
    }
    
  </style>
</head>
<body>
  
  <!-- getting the front page working! -->
  
    <div class="box"></div>
    <div class="boarderLeft"></div>
    <div class="boarderRight"></div>
    <div class="bannerText">Frederick's Website</div>

  <!-- Example generic button -->
  <div style="position:absolute; top: 220px; left: 50%; transform: translateX(-50%);">
    <button class="btn">Click Me</button>
  </div>


  <body>
  …  
  <!-- JavaScript to detect scroll -->
  <script>
    // ① Grab the element you’ll animate
    const banner = document.querySelector('.bannerText');

    // ② Listen for any scroll event on the window
    window.addEventListener('scroll', function() {
      // ③ Measure how far the page is scrolled
      const scrollY = window.scrollY || document.documentElement.scrollTop;

      // ④ Conditional: if we’ve passed 200px
      if (scrollY > 200) {
        // ⑤ “True” branch: add the class to trigger CSS
        banner.classList.add('scrolled');
      } else {
        // ⑥ “False” branch: remove it when we scroll back up
        banner.classList.remove('scrolled');
      }
    });
  </script>
</body>

  
</body>
</html>
