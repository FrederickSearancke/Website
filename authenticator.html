<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freddie’s Website</title>
  <style>
    /* Center the textbox + button */
    #textbox-container {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; gap: 10px; align-items: center;
    }

    /* Banner text */
    .bannerText {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-size: 100px;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      color: #ffffff;
      padding: 15px 0;
      transition: opacity 0.5s ease-in-out;
      opacity: 1;
      z-index: 3;
    }

    /* Vertical stack of your four text lines */
    #text-list {
      position: fixed;
      top: 100px; left: 20px;
      display: flex; flex-direction: column; gap: 8px;
      font-family: 'Oswald', sans-serif;
      font-size: 18px; font-weight: 500; color: #000;
    }

    /* preserve line-breaks in the fourth div */
    #text-4 {
      white-space: pre-wrap;
    }

    /* Button style */
    .btn {
      position: relative;
      padding: 10px 20px;
      font-size: 16px; font-family: Arial, sans-serif;
      background-color: #4285F4; color: #fff;
      border: none; border-radius: 4px;
      cursor: pointer; transition: background-color 0.3s;
    }
    .btn:hover { background-color: #3367D6; }
  </style>
</head>
<body>

  <div class="bannerText">Frederick's Website</div>
  
  <div id="text-list">
    <div>User “Freya Sinome”’s Private API Key: 3f1d5a2b4c7e8f9a0b1c2d3e4f5a6b7c</div>
    <div>User “test”’s Private API Key: d4E6f7A8b9C0d1E2f3G4h5I6j7K8l9M0n1O2p3Q</div>
    <div>User “Slim tim”’s Private API Key: A1B2-C3D4-E5F6-G7H8-I9J0-K1L2-M3N4-O5P6-Q7R8</div>
    <div id="text-4"></div>
  </div>

  

  <div id="textbox-container"></div>

  <script>
    // build textbox + button
    const container = document.getElementById('textbox-container');

    const input = document.createElement('input');
    input.type        = 'text';
    input.placeholder = 'Type something here…';
    Object.assign(input.style, {
      padding: '8px',
      fontSize: '16px',
      border: '1px solid #ccc',
      borderRadius: '4px',
      width: '250px'
    });

    const validateBtn = document.createElement('button');
    validateBtn.textContent = 'Validate';
    validateBtn.className   = 'btn';

    container.append(input, validateBtn);

    // on click: append "\n{value}" to the 4th text
    validateBtn.addEventListener('click', () => {
      const text4 = document.getElementById('text-4');
      const currentText = input.value;
      const length     = currentText.length;
      if (length>15) {
        text4.textContent += `User "Guest"'s Private API Key: ${input.value}\n`;
      }
      });
  </script>
</body>
</html>
