<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freddie’s Website</title>
  <style>
    /* center #textbox-container in the viewport, and lay out its children in a row */
    #textbox-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 10px;            /* space between input & button */
      align-items: center;  /* vertical‐align them */
    }

    /* your existing .btn style can apply to our new button too */
    .btn {
      position: relative;
      padding: 10px 20px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      background-color: #4285F4;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn:hover { background-color: #3367D6; }

    .bannerText {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      text-align: left;
      font-size: 18px;
      font-family: 'Oswald', sans-serif;
      font-weight: 50;
      color: #000000;
      padding: 15px 0;
      transition: opacity 0.5s ease-in-out;
      opacity: 1;
      z-index: 3;
    }
  </style>
</head>
<body>
  <!-- …your existing UI… -->

  <!-- centered flex‐container for our textbox + validate button -->
  <div id="textbox-container"></div>

  <div class="bannerText">user "Freya Sinome"'s Private API Key: 3f1d5a2b4c7e8f9a0b1c2d3e4f5a6b7c</div>
  <div class="bannerText">user "test"'s Private API Key: d4E6f7A8b9C0d1E2f3G4h5I6j7K8l9M0n1O2p3Q</div>
  <div class="bannerText">user "Slim tim"'s Private API Key: A1B2-C3D4-E5F6-G7H8-I9J0-K1L2-M3N4-O5P6-Q7R8</div>
  <div class="bannerText"></div>

  <script>
    const container = document.getElementById('textbox-container');

    // create the text‐input
    const input = document.createElement('input');
    input.type        = 'text';
    input.placeholder = 'Type something here…';
    input.id          = 'myTextbox';
    input.style.padding      = '8px';
    input.style.fontSize     = '16px';
    input.style.border       = '1px solid #ccc';
    input.style.borderRadius = '4px';
    input.style.width        = '250px';

    // create the validate button
    const validateBtn = document.createElement('button');
    validateBtn.textContent = 'Validate';
    validateBtn.className   = 'btn';
    validateBtn.addEventListener('click', () => {
      // whatever “validate” should do; for now:
      console.log('Validating:', input.value);
      alert(`You entered: ${input.value}, \n is it correct? ¯\\_(ツ)_/¯`);
    });

    // stick them both into the centered container
    container.append(input, validateBtn);
  </script>
</body>
</html>
